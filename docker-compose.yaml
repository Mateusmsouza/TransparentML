services:
  mongodb:
    image: mongo:6
    container_name: mongodb
    env_file: "./apps/backend/.env"
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - transparent-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    env_file: "./apps/backend/.env"
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - transparent-net

  backend:
    build:
      context: ./apps/backend/
      dockerfile: ./Dockerfile
    container_name: transparent-backend
    develop:
      watch:
        - path: ./apps/backend/
          action: sync+restart
          target: /app
    env_file: "./apps/backend/.env"
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - transparent-net

volumes:
  mongo_data:

networks:
  transparent-net:
